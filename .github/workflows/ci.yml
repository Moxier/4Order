name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-ci-publishable-key-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-ci-service-role-key-placeholder
      TRUST_PROXY_HEADERS: "false"
      TRUSTED_APP_ORIGINS: http://127.0.0.1:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint, types, unit tests, and production build
        run: pnpm verify

  database-and-browser:
    name: Database, HTTP, and browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Start and reset local Supabase
        run: |
          pnpm db:start
          pnpm db:reset

      - name: Create local application environment
        shell: bash
        run: |
          status_json="$(pnpm exec supabase status --output json)"
          api_url="$(jq -r '.API_URL' <<<"$status_json")"
          publishable_key="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<<"$status_json")"
          service_role_key="$(jq -r '.SERVICE_ROLE_KEY' <<<"$status_json")"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key"
            echo "DEMO_STAFF_PASSWORD=local-ci-password-only"
            echo "TRUST_PROXY_HEADERS=false"
            echo "TRUSTED_APP_ORIGINS=http://127.0.0.1:3000"
          } > .env.local

      - name: Run database lint and pgTAP role tests
        run: |
          pnpm db:lint
          pnpm db:test

      - name: Provision local demo staff for browser role tests
        run: pnpm seed:staff

      - name: Run concurrent database test
        run: pnpm db:test:concurrency

      - name: Build production application
        run: pnpm build

      - name: Run real HTTP and browser retry tests
        run: pnpm test:e2e

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
