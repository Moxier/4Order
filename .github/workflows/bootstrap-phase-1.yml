name: Bootstrap Phase 1 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore verified Phase 1 tree
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | tar -xz

      - name: Commit source tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/app src/modules src/shared supabase tests
          git commit -m 'feat: add Phase 1 application and database foundation'
          git push

