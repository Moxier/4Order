name: Verify Phase 2 source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify required Phase 1 and Phase 2 paths
        shell: bash
        run: |
          test -f package.json
          test -f src/app/login/page.tsx
          test -f src/modules/auth/actions.ts
          test -f src/shared/supabase/database.generated.ts
          test -f supabase/migrations/202608210001_foundation.sql
          test -f supabase/migrations/202608210002_api_grants.sql
          test -f supabase/tests/foundation.sql
          test -f tests/foundation/roles.test.ts
          test -f src/app/api/customer/orders/route.ts
          test -f 'src/app/order/[tableToken]/page.tsx'
          test -f src/modules/customer/customer-order-flow.tsx
          test -f src/modules/customer/request-security.ts
          test -f src/shared/supabase/service.ts
          test -f supabase/migrations/202608210003_customer_ordering.sql
          test -f supabase/tests/customer-ordering.sql
          test -f tests/customer/migration.test.ts
